# 10-no-private-users.conf
#
# This kernel has CONFIG_USER_NS unset, so systemd cannot set up a user
# namespace and chrony-wait.service fails with:
#
#   Failed to set up user namespacing: Invalid argument
#   Failed at step USER spawning /usr/bin/chronyc: Invalid argument
#
# The result is that the system comes up "degraded" rather than "running",
# with one failed unit, even though everything actually works.
#
# chrony itself is fine — it is a system service, not sandboxed, and it
# synchronises correctly. Only this helper unit, which waits for the sync
# to complete, needs the namespace. Disabling PrivateUsers lets it run as
# root, which is what it did before systemd sandboxed it, and it needs no
# privileges beyond reading the local chrony socket.
#
# Apply this to any system that reports "degraded" with a failed
# chrony-wait.service on this hardware.
[Service]
PrivateUsers=no
