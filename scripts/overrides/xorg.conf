# The vendor's DRM driver has no usable video plane.
#
# The picture on this box comes from the VPU's own scanout path, and the
# only DRM planes the driver exposes are the OSD overlays - which are
# composited by hardware and are not CPU-accessible. The X server's
# modesetting driver dutifully picks one of them, draws into memory it
# cannot reach, and the television stays black while Xorg reports no
# errors at all.
#
# The framebuffer path is the one that is known to work: it is what the
# text console uses (the "mesondrmfb" that patches/0003 marks primary).
# So drive X through the same device.
#
# Note that the vendor's own xorg.conf - which the vendor's image ships,
# and which the vendor's own desktop used - asks for the modesetting
# driver with "Dri2Vsync true". That path depends on the vendor CRTC's
# vblank interrupt, which never fires on this hardware (see the vblank
# bug). The fbdev path does not need a vblank at all.
#
# No "Video" option: the X server's fbdev driver ignores it and probes for
# a framebuffer instead. With patches/0005 there is exactly one to find -
# the "mesondrmfb" - so probing finds the right one, and nothing here
# depends on which /dev/fbN the kernel happens to number it.
Section "Device"
	Identifier  "Framebuffer"
	Driver      "fbdev"
EndSection

Section "ServerFlags"
	Option "AutoAddGPU" "off"
	Option "DontZap" "off"
EndSection

Section "Screen"
	Identifier "Default Screen"
	Device     "Framebuffer"
	SubSection "Display"
		Depth    24
		Virtual  1920 1080
	EndSubSection
EndSection

Section "ServerLayout"
	Identifier "Default Layout"
	Screen     "Default Screen"
EndSection
